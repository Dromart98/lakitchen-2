name: Repair ESLint lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Check out ESLint branch
        uses: actions/checkout@v5
        with:
          ref: codex/configura-eslint-y-anade-a-ci
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate resolved ESLint packages
        run: |
          grep -q 'node_modules/@eslint/eslintrc' package-lock.json
          grep -q 'node_modules/eslint-config-next' package-lock.json
          grep -q 'node_modules/eslint"' package-lock.json
          npm ci --ignore-scripts

      - name: Publish repaired branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate ESLint lockfile"
          git push origin HEAD:codex/configure-eslint-ci
