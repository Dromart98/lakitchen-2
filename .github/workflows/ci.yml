name: Inspect ESLint errors

on:
  pull_request:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show ESLint failures
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/eslint-output.txt 2>&1
          status=$?
          tail -n 220 /tmp/eslint-output.txt
          exit "$status"
