name: Authenticated E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-authenticated.yml"

permissions:
  contents: read

jobs:
  authenticated-production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: https://lakitchen-2.vercel.app
      SUPABASE_URL: https://biektlygqlvxpovolyyz.supabase.co

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check required E2E secret
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "Missing required GitHub Actions secret: SUPABASE_SERVICE_ROLE_KEY" >&2
            exit 1
          fi

      - name: Check external connectivity
        shell: bash
        run: |
          curl --silent --show-error --location --output /dev/null \
            --connect-timeout 15 --max-time 30 https://lakitchen-2.vercel.app
          curl --silent --show-error --location --output /dev/null \
            --connect-timeout 15 --max-time 30 https://biektlygqlvxpovolyyz.supabase.co

      - name: Run isolated authenticated production validation
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node tests/e2e/run-isolated-authenticated-suites.mjs
          tests/e2e/authenticated-macros.e2e.ts
          tests/e2e/authenticated-meals.e2e.ts
          tests/e2e/authenticated-recipes.e2e.ts
          tests/e2e/authenticated-plans.e2e.ts
          tests/e2e/authenticated-meal-history.e2e.ts
          tests/e2e/authenticated-shopping-list.e2e.ts
          tests/e2e/authenticated-settings.e2e.ts
          tests/e2e/authenticated-auth.e2e.ts

      - name: Remove temporary E2E artifacts
        if: always()
        shell: bash
        run: rm -rf test-results playwright-report
