name: Authenticated E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-macros-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: https://lakitchen-2.vercel.app
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check required E2E secrets
        shell: bash
        run: |
          missing=()
          [[ -n "$E2E_EMAIL" ]] || missing+=(E2E_EMAIL)
          [[ -n "$E2E_PASSWORD" ]] || missing+=(E2E_PASSWORD)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Check external connectivity
        shell: bash
        run: |
          curl --silent --show-error --location --output /dev/null \
            --connect-timeout 15 --max-time 30 https://lakitchen-2.vercel.app
          curl --silent --show-error --location --output /dev/null \
            --connect-timeout 15 --max-time 30 https://biektlygqlvxpovolyyz.supabase.co

      - name: Run authenticated macros smoke test
        run: npx playwright test tests/e2e/authenticated-macros.spec.ts

      - name: Remove temporary E2E artifacts
        if: always()
        shell: bash
        run: rm -rf test-results playwright-report
